name: snake

on:
  schedule:
    - cron: "17 9 * * *" # nightly, 09:17 UTC
  workflow_dispatch: # and on demand, from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Render the contribution graph as SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # Commit the SVGs to a branch of this repo, so the README serves them
      # from raw.githubusercontent instead of someone else's server.
      - name: Push them to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
